name: Feature request
description: Suggest an idea for PearUI
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Tell us what you're trying to do and why it's hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Sketches, screenshots or examples from other apps help.
  - type: checkboxes
    id: help
    attributes:
      label: Want to help?
      options:
        - label: I'd be happy to try building this myself
