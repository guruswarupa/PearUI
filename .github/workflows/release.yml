name: Release

# Push a tag such as v1.0.0 to build the installer and attach it to a GitHub release.
# The tag is the only place the version is written: the app, the installer and the release all take it from there.
# (Run manually from the Actions tab to just build it and download the artifact.)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a manual build (e.g. 1.0.0)'
        required: false
        default: '0.0.0-dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version comes from the tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Work out the version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ github.event.inputs.version }}' }
          "version=$($v.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: ./installer/build-installer.ps1 -Version '${{ steps.ver.outputs.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: PearUI-Setup
          path: dist/PearUI-Setup-*.exe

      - name: Write the release notes from CHANGELOG.md
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          function Read-Section([string]$heading) {
            $out = @(); $on = $false
            foreach ($l in $lines) {
              if ($l -match '^##\s*\[') { $on = $l -match ('^##\s*\[' + [regex]::Escape($heading) + '\]'); continue }
              if ($on) { $out += $l }
            }
            return ($out -join "`n").Trim()
          }
          $text = Read-Section $v
          # Tagged before the changelog heading was renamed? Use what is under [Unreleased].
          if (-not $text) { $text = Read-Section 'Unreleased' }
          if (-not $text) { $text = "See CHANGELOG.md for what changed in $v." }
          Set-Content -Path release-notes.md -Value $text -Encoding utf8

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PearUI-Setup-*.exe
          body_path: release-notes.md
